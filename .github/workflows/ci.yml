name: 지속적 통합

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7
      - name: Java 21 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Maven Wrapper 실행 권한 부여
        run: chmod +x mvnw
      - name: 백엔드 테스트 실행
        run: ./mvnw -B test

  frontend-build:
    name: 프론트엔드 검사 및 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7
      - name: Node.js 22 준비
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 코드 검사
        run: npm run lint
      - name: 프로덕션 빌드
        run: npm run build

  browser-tests:
    name: 브라우저 핵심 흐름
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7
      - name: Java 21 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Node.js 22 준비
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 백엔드 패키지 생성
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - name: 프론트엔드와 Chromium 준비
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
      - name: 백엔드 실행
        working-directory: backend
        run: nohup java -jar target/assetly-backend-*.jar --spring.profiles.active=local > ../backend.log 2>&1 &
      - name: 프론트엔드 실행
        working-directory: frontend
        run: nohup node .next/standalone/server.js > ../frontend.log 2>&1 &
      - name: 서비스 준비 대기
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend.log
          cat frontend.log
          exit 1
      - name: Playwright 테스트 실행
        working-directory: frontend
        run: npm run test:e2e
      - name: 실행 자료 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-debug-${{ github.run_id }}
          path: |
            backend.log
            frontend.log
            frontend/test-results
          if-no-files-found: warn
          retention-days: 7
