services:
  postgres:
    image: postgres:16-alpine
    container_name: assetly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetly}
      POSTGRES_USER: ${POSTGRES_USER:-assetly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assetly}
    ports:
      - "5432:5432"
    volumes:
      - assetly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  assetly-postgres-data:
